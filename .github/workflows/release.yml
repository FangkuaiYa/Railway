name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build binaries for all platforms ──────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          # Linux ARMv7
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            ext: ""
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install cross-compilation dependencies
        if: contains(matrix.target, 'linux') && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "armv7-unknown-linux-gnueabihf" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf
          elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Configure cross-compilation
        if: contains(matrix.target, 'linux') && matrix.os == 'ubuntu-latest' && matrix.target != 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          mkdir -p .cargo
          if [ "${{ matrix.target }}" = "armv7-unknown-linux-gnueabihf" ]; then
            echo '[target.armv7-unknown-linux-gnueabihf]' >> .cargo/config.toml
            echo 'linker = "arm-linux-gnueabihf-gcc"' >> .cargo/config.toml
          elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            echo '[target.aarch64-unknown-linux-gnu]' >> .cargo/config.toml
            echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml
          fi

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p railway-server

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../railway-server-${{ matrix.target }}.tar.gz railway-server${{ matrix.ext }}
          cd ../../..

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path railway-server${{ matrix.ext }} -DestinationPath ../../../railway-server-${{ matrix.target }}.zip
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: railway-server-${{ matrix.target }}
          path: railway-server-${{ matrix.target }}.*

  # ── Create GitHub Release ────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Display structure
        run: ls -R

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            **/*.tar.gz
            **/*.zip
          body: |
            ## Impostor Rust Rewrite — ${{ github.ref_name }}

            ### Platform Binaries
            | Platform | File |
            |----------|------|
            | Linux x86_64 | `railway-server-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux ARM64 | `railway-server-aarch64-unknown-linux-gnu.tar.gz` |
            | Linux ARMv7 | `railway-server-armv7-unknown-linux-gnueabihf.tar.gz` |
            | Windows x86_64 | `railway-server-x86_64-pc-windows-msvc.zip` |
            | macOS x86_64 | `railway-server-x86_64-apple-darwin.tar.gz` |
            | macOS ARM64 | `railway-server-aarch64-apple-darwin.tar.gz` |

            ### Running
            1. Download the binary for your platform
            2. Place `config.toml` next to the binary
            3. Run the server: `./railway-server`

            🤖 Generated with [Claude Code](https://claude.ai/code)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
