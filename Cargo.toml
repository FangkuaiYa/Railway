[workspace]
members = [
    "crates/railway-hazel",
    "crates/railway-protocol",
    "crates/railway-game-logic",
    "crates/railway-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Impostor/Impostor"

[workspace.dependencies]
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt"] }
bytes = "1"
tracing = "0.1"
thiserror = "2"
parking_lot = "0.12"
dashmap = "6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = "0.5"
pin-project-lite = "0.2"
chrono = "0.4"
owo-colors = "3"
